[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "track-telemetry-mcp"
version = "0.1.0"
description = "Deterministic motorsports telemetry analysis exposed through MCP."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "BoYanZh" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "mcp>=2,<3",
]

[project.optional-dependencies]
rcz = [
  "motec-log-generator @ git+https://github.com/BoYanZh/TrackTelemetryConverter.git@a5ebe305b0c92e0eb65cd84b256600aa03683d63",
]
video = [
  "opencv-python-headless>=4.10",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
track-telemetry-mcp = "track_telemetry.mcp_server:main"

[project.urls]
Repository = "https://github.com/BoYanZh/track-telemetry-mcp"
TrackTelemetryConverter = "https://github.com/BoYanZh/TrackTelemetryConverter"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
track_telemetry = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
