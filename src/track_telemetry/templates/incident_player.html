<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="docTitle">Track Telemetry Incident Player</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0d10;color:#f3f4f6}*{box-sizing:border-box}body{margin:0;padding:18px;background:#0b0d10}.wrap{max-width:1200px;margin:auto;display:grid;gap:14px}.card{background:#12161c;border:1px solid #2a3038;border-radius:14px;padding:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.muted{color:#9aa4b2;font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.65fr);gap:14px}@media(max-width:850px){.grid{grid-template-columns:1fr}}svg{width:100%;height:auto;aspect-ratio:1.55;background:#0d1117;border-radius:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{border:1px solid #2a3038;border-radius:10px;padding:10px}.label{font-size:11px;color:#9aa4b2}.value{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{border:1px solid #343c47;background:#171c23;color:#f3f4f6;border-radius:9px;padding:8px 11px}button:hover{background:#202731}input[type=range]{width:100%}.events{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.events button{font-size:12px;padding:6px 8px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#c2cad4}.swatch{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px}.note{line-height:1.55;font-size:13px}.pill{border:1px solid #343c47;border-radius:999px;padding:5px 9px;font-size:12px;color:#d6dbe3}.row{display:flex;justify-content:space-between;gap:10px}.caveats{font-size:12px;color:#9aa4b2;line-height:1.5}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h2 id="title" style="margin:0 0 5px"></h2><div class="muted">GPS course = travel direction. Body heading is yaw-rate integration anchored before the slide.</div></div>
    <div id="phase" class="pill">incident playback</div>
  </div>
  <div class="grid">
    <div class="card">
      <svg id="plot" viewBox="0 0 760 490" role="img" aria-label="incident trajectory">
        <defs>
          <marker id="travelHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#f6c85f" stroke-width="2"/></marker>
        </defs>
        <g id="layer"></g>
      </svg>
      <div class="legend" style="margin-top:10px">
        <span><span class="swatch" style="background:#ffffff"></span>clean/reference path</span>
        <span><span class="swatch" style="background:#5aa9e6"></span>incident path</span>
        <span>▸ estimated body heading</span><span>⇢ GPS travel direction</span>
      </div>
    </div>
    <div class="card">
      <div class="stats">
        <div class="stat"><div class="label">Time</div><div id="time" class="value">—</div></div>
        <div class="stat"><div class="label">Speed</div><div id="speed" class="value">—</div></div>
        <div class="stat"><div class="label">Yaw rate</div><div id="yaw" class="value">—</div></div>
        <div class="stat"><div class="label">Sideslip proxy</div><div id="beta" class="value">—</div></div>
        <div class="stat"><div class="label">Steering</div><div id="steer" class="value">—</div></div>
        <div class="stat"><div class="label">Throttle</div><div id="thr" class="value">—</div></div>
      </div>
      <div class="card" style="margin-top:10px;padding:10px"><div class="label">Nearest event</div><div id="eventNote" class="note">—</div></div>
      <div id="summary" class="muted" style="margin-top:10px"></div>
    </div>
  </div>
  <div class="card">
    <input id="slider" type="range" min="0" max="0" value="0" step="1">
    <div class="controls" style="margin-top:10px">
      <button id="back" type="button">← frame</button>
      <button id="play" type="button">Play</button>
      <button id="next" type="button">frame →</button>
      <label class="muted">Playback <select id="rate"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
    </div>
    <div id="events" class="events"></div>
  </div>
  <div class="card caveats"><strong>Caveats</strong><ul id="caveats"></ul></div>
</div>
<script>
const TITLE=__TITLE_JSON__;
const P=__PAYLOAD_JSON__;
document.getElementById('title').textContent=TITLE;document.title=TITLE;
const S=P.samples||[],R=P.clean_reference_xy||[],E=P.timeline||[];
if(!S.length)throw new Error('No incident samples in payload');
const ns='http://www.w3.org/2000/svg',g=document.getElementById('layer');
const mk=(n,a={})=>{const e=document.createElementNS(ns,n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e};
const xy=S.map(d=>[d.x_m,d.y_m]);const all=xy.concat(R);const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),pad=28,W=760,H=490;
const scale=Math.min((W-2*pad)/(maxx-minx||1),(H-2*pad)/(maxy-miny||1));const ox=(W-(maxx-minx)*scale)/2-minx*scale,oy=(H-(maxy-miny)*scale)/2+maxy*scale;
const X=x=>ox+x*scale,Y=y=>oy-y*scale,pts=a=>a.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
if(R.length>1)g.append(mk('polyline',{points:pts(R),fill:'none',stroke:'#fff','stroke-width':'4',opacity:'.50','stroke-linecap':'round','stroke-linejoin':'round'}));
g.append(mk('polyline',{points:pts(xy),fill:'none',stroke:'#5aa9e6','stroke-width':'2',opacity:'.22','stroke-linecap':'round','stroke-linejoin':'round'}));
const progress=mk('polyline',{fill:'none',stroke:'#5aa9e6','stroke-width':'5','stroke-linecap':'round','stroke-linejoin':'round'});g.append(progress);
const travel=mk('line',{stroke:'#f6c85f','stroke-width':'4','stroke-dasharray':'8 5','marker-end':'url(#travelHead)','stroke-linecap':'round'});g.append(travel);
const car=mk('g');car.append(mk('rect',{x:'-18',y:'-7',width:'36',height:'14',rx:'4',fill:'#5aa9e6',stroke:'#fff','stroke-width':'1.5'}),mk('path',{d:'M18 -7L30 0L18 7Z',fill:'#5aa9e6',stroke:'#fff','stroke-width':'1.5'}));g.append(car);
for(const ev of E){let best=0,bd=Infinity;for(let i=0;i<S.length;i++){const d=Math.abs(S[i].time_s-ev.time_s);if(d<bd){bd=d;best=i}}const s=S[best];const c=mk('circle',{cx:X(s.x_m),cy:Y(s.y_m),r:'4',fill:'#ed6a5a',stroke:'#fff','stroke-width':'1'});g.append(c)}
const slider=document.getElementById('slider');slider.max=S.length-1;
const fmt=(v,d=1)=>v==null||!Number.isFinite(v)?'—':Number(v).toFixed(d);
function nearestEvent(t){if(!E.length)return null;return E.reduce((a,b)=>Math.abs(b.time_s-t)<Math.abs(a.time_s-t)?b:a)}
function arrow(x,y,deg,len){if(deg==null||!Number.isFinite(deg)){travel.setAttribute('visibility','hidden');return}travel.setAttribute('visibility','visible');const a=-deg*Math.PI/180;travel.setAttribute('x1',x);travel.setAttribute('y1',y);travel.setAttribute('x2',x+Math.cos(a)*len);travel.setAttribute('y2',y+Math.sin(a)*len)}
function render(i){i=Math.max(0,Math.min(S.length-1,i));slider.value=i;const d=S[i],x=X(d.x_m),y=Y(d.y_m);progress.setAttribute('points',pts(xy.slice(0,i+1)));car.setAttribute('transform',`translate(${x} ${y}) rotate(${-Number(d.body_heading_estimate_deg||0)})`);arrow(x,y,d.speed_kmh!=null&&d.speed_kmh<12.9?null:d.travel_heading_deg,46);document.getElementById('time').textContent=fmt(d.time_s,3)+' s';document.getElementById('speed').textContent=d.speed_kmh==null?'—':fmt(d.speed_kmh/1.609344,1)+' mph';document.getElementById('yaw').textContent=fmt(d.yaw_rate_dps,1)+'°/s';document.getElementById('beta').textContent=fmt(d.sideslip_proxy_deg,1)+'°';document.getElementById('steer').textContent=fmt(d.steering_deg,0)+'°';document.getElementById('thr').textContent=fmt(d.throttle_pct,0)+'%';const ev=nearestEvent(d.time_s);document.getElementById('eventNote').textContent=ev?`${ev.type} @ ${Number(ev.time_s).toFixed(3)} s`:'—'}
const eventBox=document.getElementById('events');E.forEach(ev=>{const b=document.createElement('button');b.textContent=`${Number(ev.time_s).toFixed(2)} s · ${ev.type}`;b.onclick=()=>{stop();let bi=0,bd=Infinity;S.forEach((s,i)=>{const d=Math.abs(s.time_s-ev.time_s);if(d<bd){bd=d;bi=i}});render(bi)};eventBox.appendChild(b)});
const summary=P.summary||{};document.getElementById('summary').textContent=`Peak |yaw| ${fmt(summary.peak_abs_yaw_rate_dps,1)}°/s · max |sideslip proxy| ${fmt(summary.max_abs_sideslip_proxy_deg,1)}°`;
const caveats=document.getElementById('caveats');(P.caveats||[]).forEach(v=>{const li=document.createElement('li');li.textContent=v;caveats.appendChild(li)});
let raf=null,last=null,elapsed=0;const play=document.getElementById('play'),rate=document.getElementById('rate');function stop(){if(raf)cancelAnimationFrame(raf);raf=null;last=null;play.textContent='Play'}function tick(ts){if(last==null)last=ts;elapsed+=(ts-last)*Number(rate.value);last=ts;const target=S[0].time_s+elapsed/1000;let i=S.findIndex(d=>d.time_s>=target);if(i<0){render(S.length-1);stop();return}render(i);raf=requestAnimationFrame(tick)}play.onclick=()=>{if(raf){stop();return}const i=Number(slider.value);elapsed=(S[i].time_s-S[0].time_s)*1000;play.textContent='Pause';raf=requestAnimationFrame(tick)};document.getElementById('back').onclick=()=>{stop();render(Number(slider.value)-1)};document.getElementById('next').onclick=()=>{stop();render(Number(slider.value)+1)};slider.oninput=()=>{stop();render(Number(slider.value))};render(0);
</script>
</body>
</html>
